<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remi | @remi.mp4</title>

<meta property="og:title" content="Remi | @remi.mp4">
<meta property="og:description" content="miami girl with pink hair & too many selfies">
<meta property="og:image" content="https://files.catbox.moe/0hotee.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  :root{
    --pink:#FF69B4;
    --pink-dark:#d4549a;
    --pink-glow:rgba(255,105,180,.45);
    --bg:#0e0e0e;
    --card:#1a1a1a;
    --card-hover:#222;
    --text:#f0f0f0;
    --sub:#999;
  }

  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }

  body::before{
    content:'';
    position:fixed;
    inset:0;
    background:linear-gradient(
      135deg,
      #0e0e0e 0%,
      #1e1020 30%,
      #0e0e0e 50%,
      #151225 70%,
      #0e0e0e 100%
    );
    background-size:400% 400%;
    animation:gradientShift 15s ease infinite;
    z-index:0;
  }

  @keyframes gradientShift{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }

  .container{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
    padding:48px 20px 64px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }

  .avatar{
    width:110px;
    height:110px;
    border-radius:50%;
    background:var(--card);
    border:3px solid var(--pink);
    box-shadow:0 0 20px var(--pink-glow),0 0 60px rgba(255,105,180,.12);
    overflow:hidden;
    margin-bottom:10px;
    user-select:none;
  }

  .avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .name{
    font-size:26px;
    font-weight:700;
    letter-spacing:-.5px;
  }

  .handle{
    font-size:13px;
    color:var(--sub);
    margin-top:2px;
  }

  .tagline{
    font-size:14px;
    color:var(--pink);
    margin:8px 0 24px;
    font-weight:500;
    opacity:.9;
  }

  /* stats row */
  .stats{
    display:flex;
    gap:28px;
    margin-bottom:24px;
    font-size:13px;
    color:var(--sub);
  }
  .stats span{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
  }
  .stats strong{
    color:var(--text);
    font-size:16px;
    font-weight:700;
  }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .link-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:15px 20px;
    background:var(--card);
    border:1px solid rgba(255,105,180,.12);
    border-radius:14px;
    color:var(--text);
    text-decoration:none;
    font-size:15px;
    font-weight:600;
    text-align:center;
    letter-spacing:.2px;
    transition:all .25s ease;
    position:relative;
    overflow:hidden;
  }

  .link-btn::before{
    content:'';
    position:absolute;
    inset:0;
    border-radius:14px;
    opacity:0;
    background:radial-gradient(circle at center,var(--pink-glow) 0%,transparent 70%);
    transition:opacity .3s ease;
  }

  .link-btn:hover,.link-btn:focus-visible{
    border-color:var(--pink);
    box-shadow:0 0 18px rgba(255,105,180,.2),0 4px 20px rgba(0,0,0,.3);
    transform:translateY(-2px);
    background:var(--card-hover);
  }

  .link-btn:hover::before{opacity:1}

  .link-btn:active{
    transform:translateY(0);
    box-shadow:0 0 10px rgba(255,105,180,.12);
  }

  .link-btn .icon{
    font-size:18px;
    position:relative;
    z-index:1;
  }

  .link-btn .label{
    position:relative;
    z-index:1;
  }

  .link-btn.featured{
    background:linear-gradient(135deg,var(--pink-dark),var(--pink));
    border:none;
    color:#fff;
    font-size:16px;
    padding:17px 20px;
  }

  .link-btn.featured::before{
    background:radial-gradient(circle at center,rgba(255,255,255,.15) 0%,transparent 70%);
  }

  .link-btn.featured:hover{
    box-shadow:0 0 28px var(--pink-glow),0 4px 32px rgba(0,0,0,.4);
    background:linear-gradient(135deg,var(--pink-dark),var(--pink));
  }

  /* social row */
  .socials{
    display:flex;
    gap:16px;
    margin-top:24px;
  }

  .social-icon{
    width:44px;
    height:44px;
    border-radius:50%;
    background:var(--card);
    border:1px solid rgba(255,105,180,.12);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--sub);
    text-decoration:none;
    font-size:18px;
    transition:all .25s ease;
  }

  .social-icon:hover{
    border-color:var(--pink);
    color:var(--pink);
    box-shadow:0 0 14px rgba(255,105,180,.2);
    transform:translateY(-2px);
  }

  .social-icon svg{
    width:20px;
    height:20px;
    fill:currentColor;
  }

  .footer{
    margin-top:36px;
    font-size:11px;
    color:#444;
    letter-spacing:.5px;
  }

  .sparkle{
    position:fixed;
    width:2px;
    height:2px;
    border-radius:50%;
    background:var(--pink);
    opacity:0;
    pointer-events:none;
    z-index:0;
    animation:sparkle 4s ease-in-out infinite;
  }

  @keyframes sparkle{
    0%,100%{opacity:0;transform:scale(0)}
    50%{opacity:.5;transform:scale(1)}
  }
</style>
</head>
